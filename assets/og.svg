<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132f6b"/>
      <stop offset="1" stop-color="#060a18"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.28" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f2b632" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f2b632" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" x2="1">
      <stop offset="0" stop-color="#f2b632"/>
      <stop offset="0.75" stop-color="#e8742a"/>
      <stop offset="1" stop-color="#e8742a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <!-- shutter slats along the bottom -->
  <g opacity="0.14" fill="#c9d6e8">
    <rect x="0" y="560" width="1200" height="6"/>
    <rect x="0" y="580" width="1200" height="6"/>
    <rect x="0" y="600" width="1200" height="6"/>
    <rect x="0" y="620" width="1200" height="6"/>
  </g>
  <image href="icon.svg" xlink:href="icon.svg" x="96" y="135" width="360" height="360"/>
  <text x="510" y="232" font-family="Kohinoor Devanagari, Devanagari Sangam MN, Mangal, sans-serif" font-size="54" font-weight="700" fill="#f2b632">जुगाड़</text>
  <text x="506" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#fff4d6">Jugaad</text>
  <text x="506" y="448" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#fff4d6">Escape</text>
  <rect x="510" y="470" width="470" height="10" rx="5" fill="url(#stroke)"/>
  <text x="510" y="530" font-family="Georgia, serif" font-style="italic" font-size="32" fill="#f4ead0" opacity="0.9">Kuch na kuch kar lenge.</text>
</svg>
