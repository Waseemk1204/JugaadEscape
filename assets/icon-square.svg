<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Jugaad Escape</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4596"/>
      <stop offset="1" stop-color="#0a1a42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#f2b632" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#f2b632" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f2b632" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd46b"/>
      <stop offset="0.55" stop-color="#e9a72c"/>
      <stop offset="1" stop-color="#b8761a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ab"/>
      <stop offset="0.45" stop-color="#eef1f3"/>
      <stop offset="1" stop-color="#8d959d"/>
    </linearGradient>
  </defs>

  <!-- Bank-blue tile with a marigold glow -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="230" fill="url(#glow)"/>

  <!-- Shackle, popped open and swung aside -->
  <g transform="rotate(-16 186 250)">
    <path d="M186 262 V168 A70 70 0 0 1 326 168 V214" fill="none" stroke="#3b4148" stroke-width="46" stroke-linecap="round"/>
    <path d="M186 262 V168 A70 70 0 0 1 326 168 V214" fill="none" stroke="url(#steel)" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- Padlock body -->
  <rect x="120" y="236" width="272" height="206" rx="40" fill="#7a4a0e"/>
  <rect x="120" y="226" width="272" height="206" rx="40" fill="url(#brass)"/>
  <rect x="136" y="240" width="240" height="18" rx="9" fill="#fff3c4" opacity="0.45"/>

  <!-- Keyhole -->
  <circle cx="256" cy="318" r="30" fill="#2a1a06"/>
  <path d="M242 330 L234 392 H278 L270 330 Z" fill="#2a1a06"/>

  <!-- The jugaad: a bobby pin, still in the lock -->
  <g stroke="#15161a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 322 L398 180"/>
    <path d="M398 180 q10 -10 18 -2 q8 8 -2 18 l-12 12 l6 10 l-16 6 l4 12 l-16 4 l2 12 l-14 2 L272 332"/>
  </g>

  <!-- Ting! -->
  <g fill="#fff4d6">
    <path d="M430 108 l8 24 l24 8 l-24 8 l-8 24 l-8 -24 l-24 -8 l24 -8 z"/>
    <circle cx="120" cy="132" r="7" opacity="0.8"/>
    <circle cx="96" cy="176" r="4" opacity="0.6"/>
  </g>
</svg>
